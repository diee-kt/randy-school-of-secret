name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ || true
          ls -R ~/.local/share/godot/export_templates | head -20
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which keytool))))
          echo "Java: $JAVA_PATH"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOT
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          cp ~/.config/godot/editor_settings-4.3.tres ~/.config/godot/editor_settings-4.tres
      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --verbose --import || true
          godot --headless --verbose --export-debug "Android" build/randy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Revenge School Simulator
          path: build/randy.apk
